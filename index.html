<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout App</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #f4f4f4;
      color: #222;
      max-width: 480px;
      margin: 0 auto;
      padding: 1rem;
      padding-bottom: 5.5rem;
    }
    h2 { font-size: 1.1rem; margin-bottom: 0.75rem; }

    .screen { display: none; }
    .screen.active { display: block; }

    /* ── Home screen ── */
    #screen-home { padding-top: 8rem; }
    .home-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8rem;
      margin-top: 0.5rem;
      color: #111;
      text-align: center;
    }
    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #aaa;
      margin-bottom: 0.75rem;
    }
    .screen-title {
      font-size: 2rem;
      font-weight: 700;
      color: #111;
      text-align: center;
      margin-top: 0.5rem;
      margin-bottom: 8rem;
      padding-top: 8rem;
    }

    /* ── Day cards ── */
    .day-card {
      background: white;
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
      border: 1px solid #ddd;
      cursor: pointer;
      transition: background 0.15s;
    }
    .day-card:hover { background: #f0f0f0; }
    .day-card h2 { font-size: 1rem; margin-bottom: 0.25rem; color: #444; }
    .day-card p { font-size: 0.85rem; color: #aaa; }
    .rest { font-style: italic; cursor: default; }
    .day-card.today {
      background: #1a1a1a;
      border-color: #1a1a1a;
      color: white;
      padding: 1.25rem;
    }
    .day-card.today:hover { background: #2a2a2a; }
    .day-card.today h2 { color: white; font-size: 1.1rem; margin-bottom: 0.9rem; }
    .day-card.today .today-ex-row {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      padding: 0.55rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .day-card.today .today-ex-row:last-child { border-bottom: none; }
    .day-card.today .today-ex-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: white;
      flex-shrink: 0;
    }
    .day-card.today .today-ex-meta {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.4);
      white-space: nowrap;
    }
    .today-badge {
      display: inline-block;
      font-size: 0.7rem;
      background: white;
      color: #222;
      border-radius: 999px;
      padding: 0.1rem 0.5rem;
      margin-left: 0.5rem;
      font-weight: 600;
      vertical-align: middle;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ── Bottom nav ── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: white;
      border-top: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 4.5rem;
      padding: 0 1rem;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 100;
    }
    .bottom-nav .nav-back {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      height: 3rem;
      padding: 0 1.5rem;
      border: none;
      border-radius: 12px;
      background: #f4f4f4;
      font-size: 1rem;
      font-weight: 500;
      color: #333;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .bottom-nav .nav-back:active { background: #e8e8e8; }
    .bottom-nav .nav-back.hidden { display: none; }
    .nav-edit-btn {
      display: none;
      height: 3rem;
      padding: 0 1.25rem;
      border: none;
      border-radius: 12px;
      background: #f4f4f4;
      font-size: 0.95rem;
      font-weight: 500;
      color: #333;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .nav-edit-btn.visible { display: flex; align-items: center; justify-content: center; }
    .nav-edit-btn:active { background: #e8e8e8; }
    .nav-home-actions { display: none; width: 100%; gap: 0.75rem; }
    .nav-home-actions.visible { display: flex; }
    .nav-action-btn {
      flex: 1;
      height: 3rem;
      border: none;
      border-radius: 12px;
      background: #f4f4f4;
      font-size: 0.95rem;
      font-weight: 500;
      color: #333;
      cursor: pointer;
      transition: background 0.15s;
    }
    .nav-action-btn:active { background: #e8e8e8; }

    /* ── Carousel workout screen ── */
    #screen-day {
      padding: 0;
      overflow: hidden;
    }
    .carousel-header {
      padding: 1rem 1rem 0.5rem;
      padding-top: 8rem;
      text-align: center;
    }
    .carousel-day-title {
      font-size: 2rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 8rem;
    }
    .progress-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem 1rem;
    }
    .progress-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ddd;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .progress-dot.active {
      background: #222;
      width: 20px;
      border-radius: 4px;
    }
    .progress-dot.summary { background: #bbb; }
    .progress-dot.summary.active { background: #22c55e; width: 20px; border-radius: 4px; }

    .carousel-track-wrap { overflow: hidden; width: 100%; }
    .carousel-track {
      display: flex;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
    .carousel-card { min-width: 100%; padding: 0 1rem 1rem; }

    /* ── Exercise block ── */
    .exercise-block {
      background: white;
      border-radius: 12px;
      padding: 1rem;
      border: 1px solid #ddd;
      transition: opacity 0.2s, border-color 0.2s;
    }
    .exercise-block.skipped {
      opacity: 0.4;
      border-color: #eee;
      border-style: dashed;
    }
    .exercise-block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    .exercise-block-header h3 { font-size: 1rem; color: #222; margin: 0; }
    .skip-btn {
      font-size: 0.75rem;
      font-weight: 600;
      color: #aaa;
      background: none;
      border: 1px solid #ddd;
      border-radius: 999px;
      padding: 0.2rem 0.65rem;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .skip-btn:active { background: #f4f4f4; }
    .skip-btn.skipped { color: #ef4444; border-color: #fecaca; background: #fee2e2; }

    /* Last session */
    .prev-label {
      font-size: 0.72rem;
      color: #bbb;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
    }
    .prev-row {
      display: grid;
      grid-template-columns: 2.5rem 1fr 1fr;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.3rem;
      opacity: 0.45;
    }
    .prev-row .set-num { font-size: 0.8rem; color: #aaa; text-align: center; }
    .prev-val {
      background: #f4f4f4;
      border-radius: 8px;
      padding: 0.4rem;
      font-size: 0.8rem;
      text-align: center;
      color: #555;
    }
    .prev-unit { font-size: 0.7rem; color: #bbb; }
    .divider { border: none; border-top: 1px dashed #eee; margin: 0.6rem 0; }

    /* Set rows */
    .set-col-headers {
      display: grid;
      grid-template-columns: 2rem 2.5rem 1fr 1fr;
      gap: 0.5rem;
      font-size: 0.72rem;
      color: #bbb;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }
    .set-col-headers span { text-align: center; }
    .set-row {
      display: grid;
      grid-template-columns: 2rem 2.5rem 1fr 1fr;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.6rem;
    }
    .set-row .set-num { font-size: 0.85rem; color: #aaa; text-align: center; font-weight: 600; }

    /* × delete button */
    .set-delete-btn {
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      border: none;
      background: #fee2e2;
      color: #ef4444;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .set-delete-btn:active { background: #fecaca; }
    .set-delete-btn.hidden { visibility: hidden; pointer-events: none; }

    /* Steppers */
    .stepper {
      display: flex;
      align-items: center;
      border: 1px solid #ddd;
      border-radius: 10px;
      overflow: hidden;
      height: 2.6rem;
    }
    .stepper button {
      background: #f4f4f4;
      border: none;
      width: 2.2rem;
      height: 100%;
      font-size: 1.1rem;
      cursor: pointer;
      flex-shrink: 0;
      color: #444;
      line-height: 1;
    }
    .stepper button:active { background: #e0e0e0; }
    .stepper input {
      flex: 1;
      border: none;
      text-align: center;
      font-size: 0.95rem;
      width: 100%;
      min-width: 0;
      padding: 0;
      background: white;
      color: #222;
      -moz-appearance: textfield;
    }
    .stepper input::-webkit-outer-spin-button,
    .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }

    .add-set-btn {
      width: 100%;
      padding: 0.5rem;
      background: none;
      border: 1px dashed #ccc;
      border-radius: 10px;
      color: #aaa;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: all 0.15s;
    }
    .add-set-btn:hover { border-color: #aaa; color: #555; }

    /* Summary card */
    .summary-card {
      background: white;
      border-radius: 12px;
      padding: 1.25rem;
      border: 1px solid #ddd;
    }
    .summary-card h3 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; color: #111; }
    .summary-ex {
      margin-bottom: 0.85rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid #f0f0f0;
    }
    .summary-ex:last-of-type { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .summary-ex-name { font-size: 0.9rem; font-weight: 600; color: #222; margin-bottom: 0.25rem; }
    .summary-ex-skipped { font-size: 0.8rem; color: #aaa; font-style: italic; }
    .summary-set-line { font-size: 0.8rem; color: #777; margin-left: 0.5rem; }
    .save-btn {
      width: 100%;
      padding: 0.85rem;
      background: #222;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1.25rem;
    }
    .save-btn:hover { background: #444; }

    /* ── Settings ── */
    .settings-day-card {
      background: white;
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
      border: 1px solid #ddd;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.15s;
    }
    .settings-day-card:hover { background: #f0f0f0; }
    .settings-day-card .day-info h2 { font-size: 1rem; color: #222; margin-bottom: 0.15rem; }
    .settings-day-card .day-info p { font-size: 0.8rem; color: #aaa; }
    .settings-day-card .arrow { color: #ccc; font-size: 1rem; }
    .field-label { font-size: 0.75rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.35rem; }
    .field-group { margin-bottom: 1.25rem; }
    .text-input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 0.95rem;
      color: #222;
      background: white;
    }
    .text-input:focus { outline: none; border-color: #aaa; }
    .ex-edit-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
    .ex-edit-pill {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: white;
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 0.65rem 0.75rem;
      font-size: 0.9rem;
      color: #333;
    }
    .drag-handle {
      color: #ccc;
      font-size: 1.3rem;
      cursor: grab;
      flex-shrink: 0;
      padding: 0.4rem 0.5rem;
      margin: -0.4rem -0.25rem;
      touch-action: none;
    }
    .ex-edit-name { flex: 1; }
    .ex-delete-btn {
      flex-shrink: 0;
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 50%;
      border: none;
      background: #fee2e2;
      color: #ef4444;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .ex-delete-btn:active { background: #fecaca; }

    .ex-edit-inline-btn {
      flex-shrink: 0;
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 50%;
      border: none;
      background: #e8f0fe;
      color: #3b82f6;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .ex-edit-inline-btn:active { background: #c7d9fd; }
    .ex-confirm-btn {
      flex-shrink: 0;
      height: 2.4rem;
      padding: 0 0.75rem;
      border-radius: 10px;
      border: none;
      background: #222;
      color: white;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .ex-edit-input {
      flex: 1;
      padding: 0.4rem 0.5rem;
      border: 1.5px solid #3b82f6;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #222;
      background: white;
      outline: none;
    }
    .ex-edit-row.dragging { opacity: 0.4; }
    .ex-edit-row.drag-over { border-top: 2px solid #3b82f6; }
    .add-ex-row { display: flex; gap: 0.5rem; margin-top: 0.25rem; }
    .add-ex-input {
      flex: 1;
      padding: 0.65rem 0.75rem;
      border: 1px dashed #ccc;
      border-radius: 10px;
      font-size: 0.9rem;
      color: #222;
      background: white;
    }
    .add-ex-input:focus { outline: none; border-color: #aaa; border-style: solid; }
    .add-ex-btn {
      padding: 0.65rem 1rem;
      background: #222;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .add-ex-btn:hover { background: #444; }
    .rest-toggle {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem;
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      color: #333;
    }
    .rest-toggle input[type="checkbox"] { width: 1.1rem; height: 1.1rem; cursor: pointer; }

    /* ── History ── */
    .history-entry {
      background: white;
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
      border: 1px solid #ddd;
    }
    .history-entry h3 { font-size: 0.95rem; margin-bottom: 0.5rem; color: #333; }
    .history-entry .set-line { font-size: 0.8rem; color: #777; margin-left: 0.75rem; }
    .empty-history { text-align: center; color: #aaa; font-size: 0.9rem; margin-top: 3rem; font-style: italic; }
    .ex-name {
      font-size: 0.85rem;
      font-weight: 600;
      margin: 0.5rem -1rem 0.2rem;
      padding: 0.6rem 1rem;
      color: #444;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f9f9f9;
      border-radius: 8px;
      transition: background 0.15s;
    }
    .ex-name:hover { background: #f0f0f0; color: #222; }
    .ex-chevron { font-size: 0.7rem; color: #bbb; transition: transform 0.2s; }
    .ex-chevron.open { transform: rotate(180deg); }
    .chart-panel { display: none; margin: 0.5rem 0 0.75rem; background: #f9f9f9; border-radius: 10px; padding: 0.75rem; }
    .chart-panel.open { display: block; }
    .chart-toggles { display: flex; gap: 0.4rem; margin-bottom: 0.75rem; }
    .chart-toggle {
      flex: 1;
      padding: 0.35rem 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      font-size: 0.78rem;
      color: #888;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chart-toggle.active { background: #222; border-color: #222; color: white; }
    .chart-canvas-wrap { position: relative; height: 160px; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 6rem;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: white;
      padding: 0.65rem 1.25rem;
      border-radius: 999px;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 200;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <!-- SCREEN 1: Home -->
  <div id="screen-home" class="screen active">
    <h1 class="home-title">💪 My Workout Week</h1>
    <p class="section-label">This week</p>
    <div id="day-list"></div>
  </div>

  <!-- SCREEN 2: Day session (carousel) -->
  <div id="screen-day" class="screen">
    <div class="carousel-header">
      <div class="carousel-day-title" id="day-title"></div>
    </div>
    <div class="progress-indicator" id="progress-indicator"></div>
    <div class="carousel-track-wrap" id="carousel-wrap">
      <div class="carousel-track" id="carousel-track"></div>
    </div>
  </div>

  <!-- SCREEN 3: History -->
  <div id="screen-history" class="screen">
    <h1 class="screen-title">Session History</h1>
    <div id="history-list"></div>
  </div>

  <!-- SCREEN 4: Settings -->
  <div id="screen-settings" class="screen">
    <h1 class="screen-title">Edit Schedule</h1>
    <div id="settings-day-list"></div>
  </div>

  <!-- SCREEN 5: Day editor -->
  <div id="screen-day-editor" class="screen">
    <h1 id="editor-title" class="screen-title"></h1>
    <div class="field-group">
      <div class="field-label">Workout type name</div>
      <input class="text-input" id="editor-type" placeholder="e.g. Push, Pull, Legs…" />
    </div>
    <div class="field-group">
      <label class="rest-toggle">
        <input type="checkbox" id="editor-rest-toggle" onchange="toggleRestDay()" />
        Mark as rest day (no exercises)
      </label>
    </div>
    <div id="editor-exercises-section">
      <div class="field-group">
        <div class="field-label">Exercises</div>
        <div id="editor-ex-list"></div>
        <div class="add-ex-row">
          <input class="add-ex-input" id="new-ex-input" placeholder="Add exercise…" />
          <button class="add-ex-btn" onclick="addExercise()">Add</button>
        </div>
      </div>
    </div>
    <button class="save-btn" onclick="saveDayEdits()">Save Day</button>
  </div>

  <!-- Bottom nav -->
  <div class="bottom-nav" id="bottom-nav">
    <button class="nav-back hidden" id="nav-back-btn" onclick="navBack()">← Back</button>
    <div class="nav-home-actions" id="nav-home-actions">
      <button class="nav-action-btn" onclick="openHistory()">📋 History</button>
      <button class="nav-action-btn" onclick="openSettings()">⚙️ Schedule</button>
    </div>
    <button class="nav-edit-btn" id="nav-edit-btn" onclick="editCurrentWorkout()">✏️ Edit</button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ── Schedule storage ─────────────────────────────────────

    const DEFAULT_SCHEDULE = [
      { day: 'Monday',    type: 'Push',        exercises: ['Push-ups','Dumbbell Shoulder Press','Lateral Raises','Tricep Overhead Extension','Chest Squeeze Press'] },
      { day: 'Tuesday',   type: 'Pull',        exercises: ['Dumbbell Bent-Over Row','Dumbbell Chest-Supported Row','Bicep Curls','Good Mornings','Hammer Curls'] },
      { day: 'Wednesday', type: 'Legs + Core', exercises: ['Dumbbell Squats','Reverse Lunges','Glute Bridges','Plank','Dead Bug'] },
      { day: 'Thursday',  type: null,          exercises: [] },
      { day: 'Friday',    type: 'Push',        exercises: ['Push-ups','Dumbbell Shoulder Press','Lateral Raises','Tricep Overhead Extension','Chest Squeeze Press'] },
      { day: 'Saturday',  type: 'Pull',        exercises: ['Dumbbell Bent-Over Row','Dumbbell Chest-Supported Row','Bicep Curls','Good Mornings','Hammer Curls'] },
      { day: 'Sunday',    type: null,          exercises: [] },
    ];

    function getSchedule() {
      const raw = localStorage.getItem('workoutSchedule');
      return raw ? JSON.parse(raw) : DEFAULT_SCHEDULE;
    }
    function saveSchedule(schedule) {
      localStorage.setItem('workoutSchedule', JSON.stringify(schedule));
    }

    // ── Navigation ───────────────────────────────────────────

    function showScreen(id, backFn) {
      document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
      document.getElementById(id).classList.add('active');
      window.scrollTo(0, 0);
      updateBottomNav(id, backFn);
      history.pushState({ screen: id }, '');
    }

    function updateBottomNav(screenId, backFn) {
      const backBtn = document.getElementById('nav-back-btn');
      const homeActions = document.getElementById('nav-home-actions');
      const editBtn = document.getElementById('nav-edit-btn');
      const isHome = screenId === 'screen-home';
      const isWorkout = screenId === 'screen-day';
      backBtn.classList.toggle('hidden', isHome);
      homeActions.classList.toggle('visible', isHome);
      editBtn.classList.toggle('visible', isWorkout);
      backBtn._backFn = backFn || null;
    }

    function navBack() {
      const backBtn = document.getElementById('nav-back-btn');
      if (backBtn._backFn) backBtn._backFn();
      else goHome();
    }

    window.addEventListener('popstate', function() {
      const backBtn = document.getElementById('nav-back-btn');
      if (!backBtn.classList.contains('hidden')) {
        navBack();
        history.pushState({ screen: 'current' }, '');
      }
    });

    history.pushState({ screen: 'screen-home' }, '');
    updateBottomNav('screen-home', null);

    function goHome() {
      document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
      document.getElementById('screen-home').classList.add('active');
      window.scrollTo(0, 0);
      updateBottomNav('screen-home', null);
      history.pushState({ screen: 'screen-home' }, '');
    }

    // ── Home screen ──────────────────────────────────────────

    const SETS = 2;
    let currentDay = '';
    let currentType = '';
    let currentExercises = [];

    const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const todayName = DAY_NAMES[new Date().getDay()];

    function buildDayList() {
      const schedule = getSchedule();
      const container = document.getElementById('day-list');
      container.innerHTML = '';

      const todayIndex = schedule.findIndex(function(d) { return d.day === todayName; });
      const ordered = todayIndex >= 0
        ? schedule.slice(todayIndex).concat(schedule.slice(0, todayIndex))
        : schedule;

      ordered.forEach(function(entry) {
        const card = document.createElement('div');
        card.className = 'day-card';
        const isToday = entry.day === todayName;
        const isRest = !entry.type;

        if (isToday) card.classList.add('today');
        if (isRest) card.style.cursor = 'default';

        const badge = isToday ? '<span class="today-badge">Today</span>' : '';

        if (isRest) {
          card.innerHTML = '<h2>' + entry.day + badge + '</h2><p class="rest">Rest day</p>';
        } else if (isToday) {
          const lastSession = getLastSession(entry.day);
          const rows = entry.exercises.map(function(ex) {
            let meta = '';
            if (lastSession && lastSession.exercises[ex]) {
              const sets = lastSession.exercises[ex];
              const setCount = sets.length;
              const avgReps = Math.round(sets.reduce(function(sum, s) { return sum + parseFloat(s.reps || 0); }, 0) / setCount);
              const weight = parseFloat(sets[0].weight || 0);
              meta = setCount + ' sets · ' + avgReps + ' reps' + (weight > 0 ? ' · ' + weight + 'kg' : '');
            } else {
              meta = 'No previous data';
            }
            return '<div class="today-ex-row"><span class="today-ex-name">' + ex + '</span><span class="today-ex-meta">' + meta + '</span></div>';
          }).join('');
          card.innerHTML = '<h2>' + entry.day + ' — ' + entry.type + badge + '</h2>' + rows;
          card.onclick = function() { openDay(entry.day, entry.type, entry.exercises); };
        } else {
          card.innerHTML = '<h2>' + entry.day + ' — ' + entry.type + badge + '</h2><p>' + entry.exercises.length + ' exercises</p>';
          card.onclick = function() { openDay(entry.day, entry.type, entry.exercises); };
        }

        container.appendChild(card);
      });
    }

    buildDayList();

    // ── Carousel workout screen ──────────────────────────────

    let carouselIndex = 0;
    let carouselCards = [];

    function openDay(day, type, exercises) {
      currentDay = day;
      currentType = type;
      currentExercises = exercises;
      carouselIndex = 0;

      document.getElementById('day-title').textContent = day + ' — ' + type;

      const track = document.getElementById('carousel-track');
      track.innerHTML = '';
      carouselCards = [];

      const lastSession = getLastSession(day);

      exercises.forEach(function(name) {
        const card = document.createElement('div');
        card.className = 'carousel-card';
        const block = buildExerciseBlock(name, lastSession);
        card.appendChild(block);
        track.appendChild(card);
        carouselCards.push({ exerciseName: name, blockEl: block });
      });

      // Summary card
      const summaryCard = document.createElement('div');
      summaryCard.className = 'carousel-card';
      summaryCard.id = 'summary-carousel-card';
      track.appendChild(summaryCard);
      carouselCards.push({ summary: true, el: summaryCard });

      buildProgressDots();
      goToCard(0, false);
      setupCarouselSwipe();
      showScreen('screen-day', goHome);
    }

    function buildExerciseBlock(name, lastSession) {
      const block = document.createElement('div');
      block.className = 'exercise-block';
      block.dataset.exercise = name;

      // Header
      const header = document.createElement('div');
      header.className = 'exercise-block-header';
      const title = document.createElement('h3');
      title.textContent = name;
      header.appendChild(title);
      const skipBtn = document.createElement('button');
      skipBtn.className = 'skip-btn';
      skipBtn.textContent = 'Skip';
      skipBtn.onclick = function() {
        const isSkipped = block.classList.toggle('skipped');
        skipBtn.textContent = isSkipped ? 'Undo' : 'Skip';
        skipBtn.classList.toggle('skipped', isSkipped);
      };
      header.appendChild(skipBtn);
      block.appendChild(header);

      // Last session
      if (lastSession && lastSession.exercises[name]) {
        const prev = lastSession.exercises[name];
        const prevLabel = document.createElement('div');
        prevLabel.className = 'prev-label';
        prevLabel.textContent = 'Last session';
        block.appendChild(prevLabel);
        prev.forEach(function(s, i) {
          const prevRow = document.createElement('div');
          prevRow.className = 'prev-row';
          prevRow.innerHTML =
            '<span class="set-num">' + (i+1) + '</span>' +
            '<div class="prev-val">' + s.reps + '<span class="prev-unit"> reps</span></div>' +
            '<div class="prev-val">' + s.weight + '<span class="prev-unit"> kg</span></div>';
          block.appendChild(prevRow);
        });
        const divider = document.createElement('hr');
        divider.className = 'divider';
        block.appendChild(divider);
      }

      // Column headers
      const headers = document.createElement('div');
      headers.className = 'set-col-headers';
      headers.innerHTML = '<span></span><span>#</span><span>Reps</span><span>Weight kg</span>';
      block.appendChild(headers);

      // Set rows
      const rowsContainer = document.createElement('div');
      rowsContainer.className = 'rows-container';
      block.appendChild(rowsContainer);

      for (let i = 1; i <= SETS; i++) {
        const prevSet = lastSession && lastSession.exercises[name] ? lastSession.exercises[name][i-1] : null;
        const defaultReps = prevSet ? prevSet.reps : 10;
        const defaultWeight = prevSet ? prevSet.weight : 0;
        rowsContainer.appendChild(makeSetRow(name, i, defaultReps, defaultWeight, rowsContainer));
      }
      updateDeleteButtons(rowsContainer);

      // Add set button
      const addBtn = document.createElement('button');
      addBtn.className = 'add-set-btn';
      addBtn.textContent = '+ Add set';
      addBtn.onclick = function() {
        const existingRows = rowsContainer.querySelectorAll('.set-row');
        const nextNum = existingRows.length + 1;
        const lastRow = existingRows[existingRows.length - 1];
        const lastReps = lastRow ? parseFloat(lastRow.querySelector('.reps-input').value) || 10 : 10;
        const lastWeight = lastRow ? parseFloat(lastRow.querySelector('.weight-input').value) || 0 : 0;
        rowsContainer.appendChild(makeSetRow(name, nextNum, lastReps, lastWeight, rowsContainer));
        renumberRows(rowsContainer);
      };
      block.appendChild(addBtn);

      return block;
    }

    function makeSetRow(exerciseName, setNum, defaultReps, defaultWeight, container) {
      const row = document.createElement('div');
      row.className = 'set-row';
      row.dataset.exercise = exerciseName;
      row.dataset.set = setNum;

      // × delete button (left)
      const delBtn = document.createElement('button');
      delBtn.className = 'set-delete-btn';
      delBtn.textContent = '×';
      delBtn.onclick = function() {
        const allRows = container.querySelectorAll('.set-row');
        if (allRows.length <= 1) return;
        row.remove();
        renumberRows(container);
      };
      row.appendChild(delBtn);

      const setNumEl = document.createElement('span');
      setNumEl.className = 'set-num';
      setNumEl.textContent = setNum;
      row.appendChild(setNumEl);

      row.appendChild(makeStepper('reps-input', defaultReps, 1, 1));
      row.appendChild(makeStepper('weight-input', defaultWeight, 0.5, 0));

      return row;
    }

    function updateDeleteButtons(container) {
      const allRows = container.querySelectorAll('.set-row');
      allRows.forEach(function(row) {
        const btn = row.querySelector('.set-delete-btn');
        if (btn) btn.classList.toggle('hidden', allRows.length <= 1);
      });
    }

    function renumberRows(container) {
      const rows = container.querySelectorAll('.set-row');
      rows.forEach(function(row, i) {
        row.querySelector('.set-num').textContent = i + 1;
        row.dataset.set = i + 1;
      });
      updateDeleteButtons(container);
    }

    function makeStepper(className, defaultVal, step, min) {
      const wrap = document.createElement('div');
      wrap.className = 'stepper';
      const minus = document.createElement('button');
      minus.textContent = '−';
      minus.type = 'button';
      const input = document.createElement('input');
      input.type = 'number';
      input.className = className;
      input.value = defaultVal;
      input.step = step;
      input.min = min;
      const plus = document.createElement('button');
      plus.textContent = '+';
      plus.type = 'button';
      minus.onclick = function() {
        const val = parseFloat(input.value) || 0;
        input.value = Math.max(min, Math.round((val - step) * 10) / 10);
      };
      plus.onclick = function() {
        const val = parseFloat(input.value) || 0;
        input.value = Math.round((val + step) * 10) / 10;
      };
      wrap.appendChild(minus);
      wrap.appendChild(input);
      wrap.appendChild(plus);
      return wrap;
    }

    // ── Carousel navigation ──────────────────────────────────

    function buildProgressDots() {
      const indicator = document.getElementById('progress-indicator');
      indicator.innerHTML = '';
      carouselCards.forEach(function(card, i) {
        const dot = document.createElement('div');
        dot.className = 'progress-dot' + (card.summary ? ' summary' : '') + (i === 0 ? ' active' : '');

    function updateProgressDots(index) {

    function goToCard(index, animate) {

      track.style.transition = animate ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';

      summary.className = 'summary-card';

    // ── Swipe gesture ────────────────────────────────────────

    function setupCarouselSwipe() {
      const el = document.getElementById('carousel-wrap');

      // Remove previous listener if any
      if (el._swipeHandler) {
        el.removeEventListener('touchstart', el._swipeHandler.start);
        el.removeEventListener('touchmove', el._swipeHandler.move);
        el.removeEventListener('touchend', el._swipeHandler.end);
      }

      let startX = 0;
      let startY = 0;
      let isDragging = false;
      let isHorizontal = null;
      let moved = false;
      const SWIPE_THRESHOLD = 50;
      const DIRECTION_LOCK = 10;

      function onStart(e) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        isDragging = true;
        isHorizontal = null;
        moved = false;
      }

      function onMove(e) {
        if (!isDragging) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;
        if (isHorizontal === null) {
          if (Math.abs(dx) < DIRECTION_LOCK && Math.abs(dy) < DIRECTION_LOCK) return;
          isHorizontal = Math.abs(dx) > Math.abs(dy);
        }
        if (!isHorizontal) { isDragging = false; return; }
        moved = true;
        e.preventDefault();
        const track = document.getElementById('carousel-track');
        track.style.transition = 'none';
        track.style.transform = 'translateX(calc(-' + (carouselIndex * 100) + '% + ' + dx + 'px))';
      }

      function onEnd(e) {
        if (!isDragging || !isHorizontal || !moved) {
          isDragging = false;
          if (!moved) {
            const track = document.getElementById('carousel-track');
            if (track) track.style.transform = 'translateX(-' + (carouselIndex * 100) + '%)';
          }
          return;
        }
        isDragging = false;
        const dx = e.changedTouches[0].clientX - startX;
        if (dx < -SWIPE_THRESHOLD) goToCard(Math.min(carouselIndex + 1, carouselCards.length - 1), true);
        else if (dx > SWIPE_THRESHOLD) goToCard(Math.max(carouselIndex - 1, 0), true);
        else goToCard(carouselIndex, true);
      }

      el.addEventListener('touchstart', onStart, { passive: true });
      el.addEventListener('touchmove', onMove, { passive: false });
      el.addEventListener('touchend', onEnd, { passive: true });

      el._swipeHandler = { start: onStart, move: onMove, end: onEnd };
    }

    // ── Save session ─────────────────────────────────────────

    function saveSession() {
      const sessionData = {
        day: currentDay,
        type: currentType,
        date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),
        timestamp: Date.now(),
        exercises: {}
      };

      currentExercises.forEach(function(name) {
        const block = document.querySelector('.exercise-block[data-exercise="' + name + '"]');
        if (block && block.classList.contains('skipped')) return;
        const rows = document.querySelectorAll('.set-row[data-exercise="' + name + '"]');
        sessionData.exercises[name] = [];
        rows.forEach(function(row) {
          sessionData.exercises[name].push({
            reps: row.querySelector('.reps-input').value || 0,
            weight: row.querySelector('.weight-input').value || 0
          });
        });
      });

      const hist = getHistory();
      hist.unshift(sessionData);
      localStorage.setItem('workoutHistory', JSON.stringify(hist));
      showToast('Session saved!');
      setTimeout(goHome, 1200);
    }

    // ── History screen ───────────────────────────────────────

    const chartInstances = {};

    function openHistory() {
      const hist = getHistory();
      const container = document.getElementById('history-list');
      container.innerHTML = '';

      Object.keys(chartInstances).forEach(function(k) {
        chartInstances[k].destroy();
        delete chartInstances[k];
      });

      if (hist.length === 0) {
        container.innerHTML = '<p class="empty-history">No sessions saved yet.<br>Complete your first workout!</p>';
        showScreen('screen-history', goHome);
        return;
      }

      const exerciseData = {};
      hist.slice().reverse().forEach(function(session) {
        Object.keys(session.exercises).forEach(function(exName) {
          if (!exerciseData[exName]) exerciseData[exName] = [];
          exerciseData[exName].push({ date: session.date, sets: session.exercises[exName] });
        });
      });

      hist.forEach(function(session) {
        const entry = document.createElement('div');
        entry.className = 'history-entry';
        const heading = document.createElement('h3');
        heading.textContent = session.date + ' — ' + session.day + ' (' + session.type + ')';
        entry.appendChild(heading);

        Object.keys(session.exercises).forEach(function(exName) {
          const nameEl = document.createElement('div');
          nameEl.className = 'ex-name';
          const chevron = document.createElement('span');
          chevron.className = 'ex-chevron';
          chevron.textContent = '▼';
          nameEl.appendChild(document.createTextNode(exName));
          nameEl.appendChild(chevron);
          entry.appendChild(nameEl);

          session.exercises[exName].forEach(function(s, i) {
            const line = document.createElement('div');
            line.className = 'set-line';
            line.textContent = 'Set ' + (i+1) + ': ' + s.reps + ' reps @ ' + s.weight + 'kg';
            entry.appendChild(line);
          });

          const exHistory = exerciseData[exName] || [];
          if (exHistory.length >= 2) {
            const panel = document.createElement('div');
            panel.className = 'chart-panel';
            const toggles = document.createElement('div');
            toggles.className = 'chart-toggles';
            const modes = ['Reps', 'Weight', 'Both'];
            let currentMode = 'Both';
            const canvasWrap = document.createElement('div');
            canvasWrap.className = 'chart-canvas-wrap';
            const canvas = document.createElement('canvas');
            canvasWrap.appendChild(canvas);
            const chartId = exName + '_' + session.timestamp;

            function buildChart(mode) {
              if (chartInstances[chartId]) chartInstances[chartId].destroy();
              const labels = exHistory.map(function(e) { return e.date; });
              const avgReps = exHistory.map(function(e) {
                return Math.round(e.sets.reduce(function(sum, s) { return sum + parseFloat(s.reps || 0); }, 0) / e.sets.length * 10) / 10;
              });
              const avgWeight = exHistory.map(function(e) {
                return Math.round(e.sets.reduce(function(sum, s) { return sum + parseFloat(s.weight || 0); }, 0) / e.sets.length * 10) / 10;
              });
              const datasets = [];
              if (mode === 'Reps' || mode === 'Both') datasets.push({ label: 'Avg Reps', data: avgReps, borderColor: '#222', backgroundColor: 'rgba(34,34,34,0.08)', tension: 0.3, pointRadius: 4, fill: true, yAxisID: 'y' });
              if (mode === 'Weight' || mode === 'Both') datasets.push({ label: 'Avg Weight (kg)', data: avgWeight, borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.08)', tension: 0.3, pointRadius: 4, fill: true, yAxisID: mode === 'Both' ? 'y2' : 'y' });
              const scales = {
                x: { ticks: { font: { size: 10 }, maxRotation: 30 }, grid: { display: false } },
                y: { position: 'left', ticks: { font: { size: 10 } }, grid: { color: '#f0f0f0' } }
              };
              if (mode === 'Both') scales.y2 = { position: 'right', ticks: { font: { size: 10 } }, grid: { display: false } };
              chartInstances[chartId] = new Chart(canvas, {
                type: 'line',
                data: { labels: labels, datasets: datasets },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { font: { size: 10 }, boxWidth: 12 } } }, scales: scales }
              });
            }

            modes.forEach(function(mode) {
              const btn = document.createElement('button');
              btn.className = 'chart-toggle' + (mode === currentMode ? ' active' : '');
              btn.textContent = mode;
              btn.onclick = function() {
                currentMode = mode;
                toggles.querySelectorAll('.chart-toggle').forEach(function(b) { b.classList.remove('active'); });
                btn.classList.add('active');
                buildChart(mode);
              };
              toggles.appendChild(btn);
            });

            panel.appendChild(toggles);
            panel.appendChild(canvasWrap);

            nameEl.onclick = function() {
              const isOpen = panel.classList.contains('open');
              panel.classList.toggle('open', !isOpen);
              chevron.classList.toggle('open', !isOpen);
              if (!isOpen && !chartInstances[chartId]) buildChart(currentMode);
            };

            entry.appendChild(panel);
          }
        });

        container.appendChild(entry);
      });

      showScreen('screen-history', goHome);
    }

    // ── Settings ─────────────────────────────────────────────

    function editCurrentWorkout() {
      const schedule = getSchedule();
      const index = schedule.findIndex(function(d) { return d.day === currentDay; });
      if (index === -1) return;
      // After saving, return to workout screen
      editingIndex = index;
      const entry = schedule[index];
      document.getElementById('editor-title').textContent = entry.day;
      document.getElementById('editor-type').value = entry.type || '';
      const isRest = !entry.type;
      document.getElementById('editor-rest-toggle').checked = isRest;
      document.getElementById('editor-exercises-section').style.display = isRest ? 'none' : 'block';
      document.getElementById('editor-type').disabled = isRest;
      renderEditorExercises(entry.exercises || []);
      document.getElementById('new-ex-input').value = '';
      // Back goes to workout screen, not settings
      showScreen('screen-day-editor', function() {
        openDay(currentDay, currentType, getSchedule().find(function(d){ return d.day === currentDay; }).exercises);
      });
      // Override save to return to workout
      document._saveFromWorkout = true;
    }

    function openSettings() {
      const schedule = getSchedule();
      const container = document.getElementById('settings-day-list');
      container.innerHTML = '';
      schedule.forEach(function(entry, index) {
        const card = document.createElement('div');
        card.className = 'settings-day-card';
        const info = document.createElement('div');
        info.className = 'day-info';
        const name = document.createElement('h2');
        name.textContent = entry.day;
        info.appendChild(name);

        sub.textContent = !entry.type ? 'Rest day' : entry.type + ' · ' + entry.exercises.length + ' exercises';

        arrow.className = 'arrow';
        arrow.textContent = '›';

        card.appendChild(arrow);
        card.onclick = function() { openDayEditor(index); };
        container.appendChild(card);
      });
      showScreen('screen-settings', goHome);

    let editingIndex = -1;

    function openDayEditor(index) {
      editingIndex = index;
      const schedule = getSchedule();
      const entry = schedule[index];
      document.getElementById('editor-title').textContent = entry.day;
      document.getElementById('editor-type').value = entry.type || '';
      const isRest = !entry.type;
      document.getElementById('editor-rest-toggle').checked = isRest;
      document.getElementById('editor-exercises-section').style.display = isRest ? 'none' : 'block';
      document.getElementById('editor-type').disabled = isRest;
      renderEditorExercises(entry.exercises || []);
      document.getElementById('new-ex-input').value = '';
      showScreen('screen-day-editor', openSettings);
    }

    function renderEditorExercises(exercises) {
      const list = document.getElementById('editor-ex-list');
      list.innerHTML = '';
      let dragSrc = null;

      exercises.forEach(function(name, i) {
        const row = document.createElement('div');
        row.className = 'ex-edit-row';

        // ── Touch drag (mobile) ──
        let touchDragY = 0;
        row.addEventListener('touchstart', function(e) {
          if (!e.target.classList.contains('drag-handle')) return;
          touchDragY = e.touches[0].clientY;
          row.style.opacity = '0.5';
        }, { passive: true });
        row.addEventListener('touchmove', function(e) {
          if (!e.target.classList.contains('drag-handle')) return;
          e.preventDefault();
          const currentY = e.touches[0].clientY;
          const allRows = Array.from(list.querySelectorAll('.ex-edit-row'));
          // Find which row the finger is over
          let target = null;
          for (let r of allRows) {
            if (r === row) continue;
            const rect = r.getBoundingClientRect();
            if (currentY < rect.top + rect.height / 2) { target = r; break; }
          }
          if (target) {
            list.insertBefore(row, target);
          } else {
            // Finger is below all rows — move to end
            const dropZone = list.lastElementChild;
            list.insertBefore(row, dropZone);
          }
        }, { passive: false });
        row.addEventListener('touchend', function(e) {
          if (!e.target.classList.contains('drag-handle')) return;
          row.style.opacity = '';
        }, { passive: true });

        const pill = document.createElement('div');
        pill.className = 'ex-edit-pill';

        const handle = document.createElement('span');
        handle.className = 'drag-handle';
        handle.textContent = '≡';
        pill.appendChild(handle);

        const label = document.createElement('span');
        label.className = 'ex-edit-name';
        label.textContent = name;
        pill.appendChild(label);

        row.appendChild(pill);

        // ── Edit button ──
        const editBtn = document.createElement('button');
        editBtn.className = 'ex-edit-inline-btn';
        editBtn.textContent = '✏️';
        editBtn.onclick = function() {
          const originalName = label.textContent;
          delBtn.style.display = 'none';
          editBtn.style.display = 'none';

          const input = document.createElement('input');
          input.className = 'ex-edit-input';
          input.value = originalName;
          pill.replaceChild(input, label);

          const confirmBtn = document.createElement('button');
          confirmBtn.className = 'ex-confirm-btn';
          confirmBtn.textContent = '✓';

          const cancelBtn = document.createElement('button');
          cancelBtn.className = 'ex-confirm-btn';
          cancelBtn.style.background = '#aaa';
          cancelBtn.style.marginLeft = '0.25rem';
          cancelBtn.textContent = '✕';

          function exitEdit(newName) {
            label.textContent = newName;
            pill.replaceChild(label, input);
            confirmBtn.remove();
            cancelBtn.remove();
            delBtn.style.display = '';
            editBtn.style.display = '';
          }

          confirmBtn.onclick = function() {
            const newName = input.value.trim();
            if (!newName) return;
            exitEdit(newName);
          };
          cancelBtn.onclick = function() { exitEdit(originalName); };

          row.appendChild(confirmBtn);
          row.appendChild(cancelBtn);
          input.focus();
          input.select();
          input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') confirmBtn.click();
            if (e.key === 'Escape') cancelBtn.click();
          });
        };
        row.appendChild(editBtn);

        // ── Delete button ──
        const delBtn = document.createElement('button');
        delBtn.className = 'ex-delete-btn';
        delBtn.textContent = '×';
        delBtn.onclick = function() {
          const allRows = Array.from(list.querySelectorAll('.ex-edit-row'));
          const current = getCurrentEditorExercises();
          current.splice(allRows.indexOf(row), 1);
          renderEditorExercises(current);
        };
        row.appendChild(delBtn);

        list.appendChild(row);
      });

      // Drop zone after last item so items can be dragged to the end
      const dropZone = document.createElement('div');
      dropZone.style.height = '0.75rem';
      dropZone.style.transition = 'border 0.1s';
      dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.style.borderTop = '2px solid #3b82f6'; });
      dropZone.addEventListener('dragleave', function() { dropZone.style.borderTop = ''; });
      dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        if (dragSrc) list.insertBefore(dragSrc, dropZone);
        dropZone.style.borderTop = '';
      });
      list.appendChild(dropZone);
    }

    function getCurrentEditorExercises() {
      return Array.from(document.querySelectorAll('#editor-ex-list .ex-edit-name')).map(function(r) {
        return r.textContent;
      });
    }

    function addExercise() {
      const input = document.getElementById('new-ex-input');
      const name = input.value.trim();
      if (!name) return;
      const current = getCurrentEditorExercises();
      current.push(name);
      renderEditorExercises(current);
      input.value = '';
      input.focus();
    }

    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('new-ex-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') addExercise();
      });
    });

    function toggleRestDay() {
      const isRest = document.getElementById('editor-rest-toggle').checked;
      document.getElementById('editor-exercises-section').style.display = isRest ? 'none' : 'block';
      document.getElementById('editor-type').disabled = isRest;
    }

    function saveDayEdits() {
      const schedule = getSchedule();
      const isRest = document.getElementById('editor-rest-toggle').checked;
      const typeName = document.getElementById('editor-type').value.trim();
      if (!isRest && !typeName) { showToast('Please enter a workout type name'); return; }
      schedule[editingIndex].type = isRest ? null : typeName;
      schedule[editingIndex].exercises = isRest ? [] : getCurrentEditorExercises();
      saveSchedule(schedule);
      buildDayList();
      showToast('Day saved!');

      const fromWorkout = document._saveFromWorkout;
      document._saveFromWorkout = false;

      setTimeout(function() {
        if (fromWorkout) {
          const updatedEntry = getSchedule().find(function(d) { return d.day === currentDay; });
          if (updatedEntry) openDay(currentDay, updatedEntry.type, updatedEntry.exercises);
        } else {
          openSettings();
        }
      }, 800);
    }

    // ── Storage helpers ──────────────────────────────────────

    function getHistory() {
      const raw = localStorage.getItem('workoutHistory');
      return raw ? JSON.parse(raw) : [];
    }

    function getLastSession(day) {
      return getHistory().find(function(s) { return s.day === day; }) || null;
    }

    // ── Toast ────────────────────────────────────────────────

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 2000);
    }
  </script>
</body>
</html>
